name: epoku checks

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/ci.yml', '.nvmrc']
  pull_request:
    branches: [main]
    paths: ['app/**', '.github/workflows/ci.yml', '.nvmrc']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test
        run: npm test
      - name: Build
        run: npm run build


  # Android のデバッグ APK を作り、Actions の画面からダウンロードできるようにする
  # （Actions → この実行 → Artifacts の「epoku-debug-apk」）。署名はデバッグ用なので配布・ストア公開には使わない
  android-apk:
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build web app and copy it into Android
        run: |
          npm run build
          npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: epoku-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
